<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReelChef AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ea580c">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16 font-sans">

    <header class="bg-orange-600 p-4 shadow-lg sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">🍳 ReelChef Famiglia</h1>
        <div class="flex gap-2">
            <button onclick="changePin()" class="text-xs bg-orange-900/70 px-2.5 py-1.5 rounded-lg">🔑 PIN</button>
            <button onclick="loadArchive()" class="text-sm bg-orange-800 px-3 py-1.5 rounded-lg font-medium">🔄 Aggiorna</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-6">
        <div class="bg-slate-800 p-4 rounded-xl shadow border border-slate-700 space-y-3">
            <label class="block text-sm font-medium text-slate-300">Link del Reel (Facebook, Instagram, TikTok)</label>
            <div class="flex gap-2">
                <input id="reelUrl" type="url" placeholder="Incolla il link qui..." 
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500">
                <button onclick="extractRecipe()" id="btnExtract"
                    class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded-lg font-bold text-sm shrink-0">
                    Estrai ✨
                </button>
            </div>
            <p id="statusMsg" class="text-xs text-orange-400 hidden animate-pulse">
                ⏳ Scarico il video e lo passo allo Chef Gemini (15-30 sec)...
            </p>
        </div>

        <div id="recipeCard" class="hidden bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="bg-slate-700/50 p-4 border-b border-slate-700">
                <div class="flex justify-between items-start">
                    <h2 id="rTitle" class="text-2xl font-bold text-orange-400"></h2>
                    <button onclick="deleteCurrentRecipe()" class="text-xs text-red-400 bg-slate-900 px-2 py-1 rounded">🗑️ Elimina</button>
                </div>
                <div class="flex gap-4 mt-2 text-xs text-slate-300">
                    <span>⏱️ <strong id="rTime"></strong></span>
                    <span>🍽️ Porzioni: <strong id="rServings"></strong></span>
                    <a id="rSource" href="#" target="_blank" class="text-orange-400 underline ml-auto">🔗 Video originale</a>
                </div>
            </div>

            <div class="p-4 space-y-6">
                <div>
                    <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">🛒 Ingredienti</h3>
                    <ul id="rIngredients" class="space-y-2"></ul>
                </div>

                <div class="bg-slate-900/90 p-3.5 rounded-lg border border-orange-500/40 space-y-2">
                    <label class="block text-xs font-bold text-orange-400 uppercase">🔄 Sostituisci Ingredienti o Porzioni (Salva in automatico)</label>
                    <div class="flex gap-2">
                        <input id="subInput" type="text" placeholder="Es: 'Usa ricotta invece di panna' o 'Per 4 persone'" 
                            class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm">
                        <button onclick="modifyRecipe()" id="btnSub"
                            class="bg-orange-600 px-3 py-2 rounded-lg text-sm font-bold shrink-0">
                            Ricalcola
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">👨‍🍳 Procedimento</h3>
                    <ol id="rSteps" class="space-y-3 text-sm leading-relaxed"></ol>
                </div>

                <div class="bg-amber-950/40 border border-amber-700/50 p-3 rounded-lg text-xs text-amber-200">
                    <strong>💡 Nota dello Chef:</strong> <span id="rTips"></span>
                </div>
            </div>
        </div>

        <div id="archiveSection" class="space-y-3">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">📚 Ricettario Condiviso</h3>
            <div id="archiveList" class="space-y-2"></div>
        </div>
    </main>

    <script>
        let currentRecipe = null;

        function getPin() {
            let pin = localStorage.getItem('reelchef_pin');
            if (!pin) {
                pin = prompt("Inserisci il PIN di famiglia per sbloccare ReelChef:");
                if (pin) localStorage.setItem('reelchef_pin', pin.trim());
            }
            return pin || '';
        }

        function changePin() {
            const newPin = prompt("Inserisci il PIN di famiglia:", localStorage.getItem('reelchef_pin') || '');
            if (newPin !== null) {
                localStorage.setItem('reelchef_pin', newPin.trim());
                loadArchive();
            }
        }

        function renderRecipe(recipe) {
            currentRecipe = recipe;
            document.getElementById('recipeCard').classList.remove('hidden');
            document.getElementById('rTitle').textContent = recipe.title;
            document.getElementById('rTime').textContent = recipe.prep_time;
            document.getElementById('rServings').textContent = recipe.servings;
            document.getElementById('rSource').href = recipe.source_url || '#';

            const ingList = document.getElementById('rIngredients');
            ingList.innerHTML = '';
            recipe.ingredients.forEach((ing) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between bg-slate-900/60 p-2.5 rounded-lg text-sm";
                li.innerHTML = `
                    <label class="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" class="accent-orange-500 w-4 h-4 rounded">
                        <span><strong>${ing.amount}</strong> ${ing.item} <em class="text-xs text-slate-400">${ing.notes || ''}</em></span>
                    </label>
                    <button onclick="prefillSub('${ing.item.replace(/'/g, "\\'")}')" class="text-xs text-orange-400 px-2 py-1 bg-slate-800 rounded shrink-0">
                        🔄 Cambia
                    </button>
                `;
                ingList.appendChild(li);
            });

            const stepsList = document.getElementById('rSteps');
            stepsList.innerHTML = '';
            recipe.steps.forEach((step, index) => {
                const li = document.createElement('li');
                li.className = "flex gap-3 bg-slate-900/40 p-3 rounded-lg";
                li.innerHTML = `<span class="bg-orange-600 text-white font-bold rounded-full w-6 h-6 flex items-center justify-center shrink-0 text-xs">${index + 1}</span><span>${step}</span>`;
                stepsList.appendChild(li);
            });

            document.getElementById('rTips').textContent = recipe.chef_tips || 'Nessuna nota aggiuntiva.';
        }

        function prefillSub(ingredientName) {
            const input = document.getElementById('subInput');
            input.value = `Sostituisci ${ingredientName} con `;
            input.focus();
        }

        async function extractRecipe() {
            const url = document.getElementById('reelUrl').value.trim();
            if (!url) return alert("Inserisci un link valido!");
            
            const status = document.getElementById('statusMsg');
            const btn = document.getElementById('btnExtract');
            status.classList.remove('hidden');
            btn.disabled = true;

            try {
                const res = await fetch('/api/extract', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-App-Pin': getPin()},
                    body: JSON.stringify({url})
                });
                const data = await res.json();
                if (res.status === 401) { localStorage.removeItem('reelchef_pin'); throw new Error("PIN errato! Riprova."); }
                if (!res.ok) throw new Error(data.detail || "Errore durante l'estrazione");
                renderRecipe(data);
                loadArchive();
            } catch (err) {
                alert("Errore: " + err.message);
            } finally {
                status.classList.add('hidden');
                btn.disabled = false;
            }
        }

        async function modifyRecipe() {
            const modText = document.getElementById('subInput').value.trim();
            if (!modText || !currentRecipe) return;

            const btn = document.getElementById('btnSub');
            btn.textContent = "⏳...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/substitute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-App-Pin': getPin()},
                    body: JSON.stringify({recipe: currentRecipe, modification_request: modText})
                });
                const updated = await res.json();
                if (!res.ok) throw new Error(updated.detail || "Errore");
                renderRecipe(updated);
                document.getElementById('subInput').value = '';
                loadArchive();
            } catch (err) {
                alert("Errore: " + err.message);
            } finally {
                btn.textContent = "Ricalcola";
                btn.disabled = false;
            }
        }

        async function deleteCurrentRecipe() {
            if (!currentRecipe || !confirm("Eliminare questa ricetta dal ricettario condiviso?")) return;
            await fetch(`/api/recipes/${currentRecipe.id}`, {
                method: 'DELETE',
                headers: {'X-App-Pin': getPin()}
            });
            document.getElementById('recipeCard').classList.add('hidden');
            loadArchive();
        }

        async function loadArchive() {
            const res = await fetch('/api/recipes', {headers: {'X-App-Pin': getPin()}});
            if (res.status === 401) return;
            const recipes = await res.json();
            const list = document.getElementById('archiveList');
            list.innerHTML = recipes.length ? '' : '<p class="text-xs text-slate-500">Nessuna ricetta ancora salvata.</p>';
            recipes.forEach(r => {
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center cursor-pointer hover:border-orange-500";
                div.onclick = () => { renderRecipe(r); window.scrollTo({top: 0, behavior: 'smooth'}); };
                div.innerHTML = `<div><p class="font-bold text-sm text-orange-300">${r.title}</p><p class="text-xs text-slate-400">⏱️ ${r.prep_time} • ${r.ingredients.length} ingredienti</p></div><span class="text-slate-400">👉</span>`;
                list.appendChild(div);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadArchive();
            const params = new URLSearchParams(window.location.search);
            const sharedText = params.get('url') || params.get('text') || params.get('title') || '';
            const urlMatch = sharedText.match(/https?:\/\/[^\s]+/);
            if (urlMatch) {
                document.getElementById('reelUrl').value = urlMatch[0];
                window.history.replaceState({}, document.title, "/");
                extractRecipe();
            }
        });
    </script>
</body>
</html>
